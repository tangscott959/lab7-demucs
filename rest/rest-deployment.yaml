# Local image. Build with rest/Makefile before applying.
# imagePullPolicy Never keeps Kubernetes from looking up Docker Hub.
# Before GKE, push the image and switch this to the registry name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demucs-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demucs-rest
  template:
    metadata:
      labels:
        app: demucs-rest
    spec:
      containers:
      - name: rest
        image: demucs-rest:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MINIO_HOST
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "rootuser"
        - name: MINIO_SECRET_KEY
          value: "rootpass123"
