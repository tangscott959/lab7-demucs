# Local MinIO. The Service name matches minio-external-service.yaml and
# the port-forward in deploy-local-dev.sh. Credentials match minio-config.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: minio-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-proj
  namespace: minio-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-proj
  template:
    metadata:
      labels:
        app: minio-proj
    spec:
      containers:
      - name: minio
        # Official minio/minio and quay.io/minio images no longer allow anonymous pulls.
        image: cgr.dev/chainguard/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "rootuser"
        - name: MINIO_ROOT_PASSWORD
          value: "rootpass123"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-proj
  namespace: minio-ns
spec:
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  selector:
    app: minio-proj
